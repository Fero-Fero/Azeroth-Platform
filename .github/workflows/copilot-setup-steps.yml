name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - global.json
      - backend/**/*.csproj
      - backend/**/*.sln
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - global.json
      - backend/**/*.csproj
      - backend/**/*.sln

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up .NET SDK 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Show installed .NET SDKs
        run: dotnet --list-sdks

      - name: Restore backend solution
        working-directory: backend
        run: dotnet restore AzerothPlatform.sln
